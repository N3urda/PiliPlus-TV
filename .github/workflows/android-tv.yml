name: Android TV test APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-tv-mvp

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Apply upstream Flutter and material patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Test
        run: flutter test --no-pub
      - name: Build universal APK
        run: flutter build apk --release --no-pub --build-name=0.1.0 --build-number=1 --dart-define=PILIPLUS_TV=true
      - name: Name test APK
        run: cp build/app/outputs/flutter-apk/app-release.apk PiliPlus-TV-v0.1.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-TV-v0.1.0-test
          path: PiliPlus-TV-v0.1.0-test.apk
          if-no-files-found: error
